  <!-- Subtle Obsidian Grid Gridlet -->
  <circle cx="390" cy="50" r="3" fill="#D4D4D4"/>
  <circle cx="410" cy="50" r="3" fill="#D4D4D4"/>
  <circle cx="390" cy="70" r="3" fill="#D4D4D4"/>
  <circle cx="410" cy="70" r="3" fill="#D4D4D4"/>
  
