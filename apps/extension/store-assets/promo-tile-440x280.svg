  <text x="136" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7C3AED" letter-spacing="1.5">CHROME EXTENSION</text>
  
